name: Build Linux Daemon Llano TKG-BORE Kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged

    steps:
      - name: Update System & Install Dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git bc bison flex libelf openssl pahole kmod cpio sudo diffutils patch tar xz zstd python rsync wget base-devel

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Builder User & Clone Linux-TKG
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          su builder -c "git clone --depth=1 https://github.com/Frogging-Family/linux-tkg.git /home/builder/linux-tkg"

      - name: Configure Linux-TKG for AMD Llano K10 + BORE
        run: |
          cat << 'CFG' > /home/builder/linux-tkg/customization.cfg
          _distro="Arch"
          _version="6.12"
          _cpusched="bore"
          _processor_opt="amdfam10"
          _timer_freq="1000"
          _default_cpu_gov="ondemand"
          _aggressive_ondemand="true"
          _preempt="full"
          _compiler="gcc"
          _menunconfig="false"
          _modprobeddb="false"
          _custom_pkgbase="linux-daemon-llano"
          _noccache="true"
          _strip="true"
          _kernel_localversion="-daemon-llano"
          _kernel_workfolder="/home/builder/linux-tkg/workfolder"
          CFG
          chown -R builder:builder /home/builder/linux-tkg

      - name: Build Kernel (linux-tkg automated makepkg)
        run: |
          su builder -c "cd /home/builder/linux-tkg && makepkg -s --noconfirm"
          cp /home/builder/linux-tkg/*.pkg.tar.zst /__w/daemon-kernel-builder/daemon-kernel-builder/ || true

      - name: List Artifacts
        run: |
          ls -la /__w/daemon-kernel-builder/daemon-kernel-builder/*.pkg.tar.zst || ls -la /home/builder/linux-tkg/*.pkg.tar.zst

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v6.12-daemon-llano-tkg
          name: "Linux Kernel 6.12 TKG-BORE (AMD Llano -march=amdfam10)"
          body: |
            ## 🚀 Custom TKG-BORE Kernel for Daemon (AMD A4-3330MX)
            
            - **Engine**: Tk-Glitch Linux-TKG
            - **Target Architecture**: AMD K10.5 (`-march=amdfam10 -O2`)
            - **CPU Scheduler**: BORE (Burst-Oriented Response Enhancer)
            - **Preemption**: Desktop Low-Latency (`CONFIG_PREEMPT_FULL=y`)
            - **Timer Frequency**: 1000 Hz (`CONFIG_HZ_1000=y`)
            - **Governor**: Aggressive OnDemand
            
            ### 💻 1-Click Install Command on Arch Linux:
            ```bash
            sudo pacman -U https://github.com/liebertjohan-art/daemon-kernel-builder/releases/download/v6.12-daemon-llano-tkg/linux-daemon-llano-*.pkg.tar.zst
            ```
          files: "/home/builder/linux-tkg/*.pkg.tar.zst"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
